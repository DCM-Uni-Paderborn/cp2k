# Slow/manual ADDED_MOS AUTO tail companions: run
# Al_kp_ot_added_auto_converge.inp and Al_kp_ot_added_auto_sym3_converge.inp
# by hand. They are intentionally not listed here, so the default regtest stays
# cheap while the adaptive AUTO grow path can still be checked against the
# 1E-6 Mermin path.  The current isolated references grow AUTO 4->8->16.
# The reduced 3-point path converges at -8.15998707914759 Ha in 21 final-stage
# MPI-2 steps and at -8.15998690653974 Ha in 148 total serial OT steps.  Its
# exact canonical-density residual is below 8E-7 Ha in both layouts and the
# endpoints agree within 2E-7 Ha.  The full grid reaches -8.15998707987167 Ha
# (MPI-2) and -8.15998694484553 Ha (serial); symmetry-reduced/full endpoints
# agree within 2.1E-8 Ha for a fixed layout.
# No first/last-band, AUTO-exhausted,
# MAX-ITER, or "Unsupported content type" signature is printed.
# Al_kp_ot_uks_full_all_sym3_converge.inp is the unlisted four-channel UKS
# physics companion.  With two spins, two irreducible k-points, and fixed
# magnetization it converges in 153 uninterrupted MPI-2 OT steps to
# -8.14036040968823 Ha, within 5.3E-7 Ha of diagonalization while retaining
# weighted spin populations 7/5 and finite entropy.
# Al_kp_ot_uks_common_mu_sym3_converge.inp is the complementary shared-mu
# four-channel anchor.  FULL_ALL converges in 188 MPI-2 steps to
# -8.16155075188063 Ha, within 1.6E-7 Ha of diagonalization, and reproduces
# the unconstrained spin populations 6.33333/5.66667.  A serial run converges
# in 158 steps within 4.4E-7 Ha and exchanges only the equivalent spin labels.
