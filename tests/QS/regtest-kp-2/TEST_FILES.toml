# Slow/manual ADDED_MOS AUTO tail companions: run
# Al_kp_ot_added_auto_converge.inp and Al_kp_ot_added_auto_sym3_converge.inp
# by hand. They are intentionally not listed here, so the default regtest stays
# cheap while the adaptive AUTO grow path can still be checked against the
# 1E-6 Mermin path. The LOW 2x1x1 reference converges in 111 final-space
# MPI-2 steps and reaches -8.14585308840704 Ha. The symmetry-reduced
# 3x1x1 reference takes roughly 60-75 MPI-2/OMP-2 final-space steps and reaches
# -8.1599870795 Ha within 4E-10 Ha without overgrowing its empty virtual edge. The
# explicit full-grid 3x1x1 companion takes 57 final-space steps and reaches
# -8.15998707954940 Ha. Their endpoints agree within 2E-12 Ha even though
# their local virtual-space growth histories differ.
# No first/last-band, AUTO-exhausted, MAX-ITER, or "Unsupported content type"
# signature is printed. Al_kp_ot_added_auto_sym3_restart.inp restores the
# converged reduced-grid state in one step.
# Al_kp_ot_added_auto_sym3_force.inp is an unlisted EPS_SCF=1E-8 force/stress
# companion that reads the reduced-grid converged restart. Relative to
# Al_kp_diag_fermi_sym3_force.inp, energy agrees within 1E-10 Ha, force
# components within 4.3E-7 Ha/bohr, and analytical stress within 0.52 bar.
# Al_kp_ot_uks_full_all_sym3_converge.inp is the unlisted four-channel UKS
# physics companion.  With two spins, two irreducible k-points, and fixed
# magnetization it converges in 91 uninterrupted MPI-2/OMP-2 OT steps to
# -8.14036045443613 Ha, within 4.8E-7 Ha of diagonalization while retaining
# weighted spin populations 7/5 and finite entropy.
# Al_kp_ot_uks_full_all_sym3_restart.inp restores all four (spin,k-point)
# channels in one step.
# Al_kp_ot_uks_common_mu_sym3_converge.inp is the complementary shared-mu
# four-channel anchor and exercises the automatic unrestricted metallic
# defaults. FULL_ALL converges in 225 MPI-2/OMP-2 steps to
# -8.16155092823292 Ha, within 1.9E-8 Ha of diagonalization, and reproduces
# the unconstrained spin populations 6.33333/5.66667.
# Al_kp_ot_uks_common_mu_sym3_restart.inp also restores the four-channel state
# in one step.
# The unlisted Na_kp_ot_added_auto_sym333_converge.inp is the stricter atomic
# 3x3x3 fixed-N companion. It grows AUTO 4->8->16 and converges in 315 steps
# at -9.01953180115599 Ha. Na_kp_ot_added_auto_sym333_restart.inp restores
# the converged state in one step within 6E-12 Ha; its strict 1E-8 companion
# reaches -9.01953181739052 Ha in 104 steps.
# The unlisted Al_kp_ot_gaussian_sym3_converge.inp and its restart companion
# provide the converged symmetry-reduced Gaussian path at
# -8.15946107404605 Ha; the restart closes in one step and diagonalization is
# within 4.6E-8 Ha. Gaussian prints the variational smearing free energy but
# deliberately not the Fermi-Dirac-only Mermin label.
# Al_kp_ot_gaussian_gamma_converge.inp is the complete-space Gamma
# companion and converges in 121 final-space MPI-2 steps without flat-tail
# recovery. Their matching unlisted Al_kp_diag_gaussian_* inputs are
# independent diagonalization references.
# Fe_kp_ot_uks_added_auto_sym3_diis_converge.inp is the unlisted four-channel
# transition-metal Pulay companion. It grows AUTO 4->8->16 and converges in
# 172 steps at -123.63311571661103 Ha, within 5E-9 Ha of the CG endpoint.
# Keep these physics checks manual so the registered restart/AUTO coverage
# remains inexpensive.
"Al_kp_ot_restart_write.inp"            = [{matcher="E_total", tol=1.0E-10, ref=-8.12746952989461},
                                           {matcher="Mermin_free_energy", tol=1.0E-10, ref=-8.12746952989461},
                                           {matcher="Electronic_entropic_energy", tol=1.0E-8, ref=-3.004898018E-5},
                                           {matcher="N_kpoints", tol=0.0, ref=1},
                                           {matcher="NO_TEXT", text="K-point smearing includes the first band"},
                                           {matcher="NO_TEXT", text="K-point smearing includes the last band"},
                                           {matcher="NO_TEXT", text="MAX ITER EXCEEDED"},
                                           {matcher="NO_TEXT", text="Unsupported content type"}]
