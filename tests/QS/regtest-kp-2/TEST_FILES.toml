# Slow/manual ADDED_MOS AUTO tail companions: run
# Al_kp_ot_added_auto_converge.inp and Al_kp_ot_added_auto_sym3_converge.inp
# by hand. They are intentionally not listed here, so the default regtest stays
# cheap while the adaptive AUTO grow path can still be checked against the
# 1E-6 Mermin path. The LOW 2x1x1 reference converges in 111 final-space
# MPI-2 steps and reaches -8.14585308840704 Ha. The symmetry-reduced
# 3x1x1 reference takes 54-66 total MPI-2/OMP-2 SCF steps across three fresh
# replicas and reaches -8.159987079 Ha within 2E-10 Ha without overgrowing its
# empty virtual edge. After 32 accepted tail samples, a dominant complete
# complex orbital block relative to the independent canonical-density block
# refreshes the physical REF subspace, preventing a path-dependent stale tail.
# The explicit full-grid 3x1x1 companion follows the same endpoint in roughly 60-90
# final-space steps. Their EPS_SCF=1E-6 endpoints agree within 1E-8 Ha even though
# their local virtual-space growth histories differ.
# No first/last-band, AUTO-exhausted, MAX-ITER, or "Unsupported content type"
# signature is printed. Al_kp_ot_added_auto_sym3_restart.inp restores the
# converged reduced-grid state in one step.
# Al_kp_ot_added_auto_sym3_force.inp is an unlisted EPS_SCF=1E-8 force/stress
# companion that reads the reduced-grid converged restart. Relative to
# Al_kp_diag_fermi_sym3_force.inp, energy agrees within 2.4E-9 Ha, force
# components within 5.0E-7 Ha/bohr, and analytical stress within 0.52 bar.
# Al_kp_ot_uks_full_all_sym3_converge.inp is the unlisted four-channel UKS
# physics companion.  With two spins, two irreducible k-points, and fixed
# magnetization, current CG/DIIS MPI-2/OMP-2 trajectories converge in 237/146
# OT steps near -8.14036050 Ha, within 2.7E-8 Ha of tight diagonalization while
# retaining weighted spin populations 7/5 and finite entropy. Earlier CG
# trajectories needed 91--164 steps, illustrating the nonlinear path spread.
# Analytic forces and stress
# agree with diagonalization within 1.1E-6 Ha/bohr and 1.3 bar at EPS_SCF=1E-7.
# Al_kp_ot_uks_full_all_sym3_restart.inp restores all four (spin,k-point)
# channels in one step.
# Al_kp_ot_uks_common_mu_sym3_converge.inp is the complementary shared-mu
# four-channel anchor and exercises the automatic unrestricted metallic
# defaults. Fresh MPI-2/OMP-2 DIIS trajectories converge in 90--127 steps near
# -8.16155089 Ha, within 2.5E-8 Ha of diagonalization, versus 129 steps for CG,
# and reproduce the unconstrained spin populations 6.33333/5.66667.
# Al_kp_ot_uks_common_mu_sym3_restart.inp also restores the four-channel state
# in one step.
# The unlisted Na_kp_ot_added_auto_sym333_converge.inp is the stricter atomic
# 3x3x3 fixed-N companion. It grows AUTO 4->8->16 and converges in 364 steps
# near -9.01953180124 Ha. Its ordinary restart restores the
# converged state in one step. The strict 1E-8 companion is also unlisted.
# The derivative-resolved accepted-secant path converges in 99 MPI-2/OMP-2
# steps at -9.01953180130 Ha and its own OT restart closes in one step. Its conservative
# 640-step allowance keeps this a robust manual physics regression without
# adding the residual-tail cost to the default suite.
# The unlisted Al_kp_ot_gaussian_sym3_converge.inp and its restart companion
# provide the converged symmetry-reduced Gaussian path at
# -8.15946107404605 Ha; the restart closes in one step and diagonalization is
# within 4.6E-8 Ha. Gaussian prints the variational smearing free energy but
# deliberately not the Fermi-Dirac-only Mermin label.
# Al_kp_ot_gaussian_gamma_converge.inp is the explicit-Gamma companion. The
# adaptive 16-MO space converges in roughly 280-350 MPI-2 steps; its complete physical
# residual, rather than its already small search or density residual, controls
# the final tail. Their matching unlisted Al_kp_diag_gaussian_* inputs are
# independent diagonalization references.
# Fe_kp_ot_uks_added_auto_sym3_diis_converge.inp is the unlisted four-channel
# transition-metal Pulay physics companion. Its spin-resolved AUTO buffers grow
# (4,6)->(8,10)->(16,18), preserving common 13->17->25 MO spaces. Accepted-drop
# calibrated finite-response probes cross the former 5.33E-5 residual plateau;
# the final AUTO space converges in 177 MPI-2/OMP-2 steps at
# -123.633115713999 Ha, consistent with the CG endpoint -123.63311572 Ha.
# Fe_kp_ot_uks_added_auto_sym3_diis_restart.inp checks the matching multi-group
# DIIS restart without replaying the AUTO growth sequence.
# Fe_kp_ot_uks_added_auto_full3_diis_converge.inp is the complementary six-channel
# FULL_GRID/SYMMETRY OFF physics check. Its AUTO buffers follow the same growth
# sequence and converge in 199 MPI-2/OMP-2 final-space steps at
# -123.63311571681535 Ha. The matching v37 restart companion closes in one step
# without replaying AUTO growth or rebuilding the physical subspace.
# Fe_kp_diag_uks_fermi_sym3_converge.inp uses stable direct density mixing to
# refine that endpoint to EPS_SCF=1E-8 in 40 steps; its free energy differs by
# only 7.5E-9 Ha. The matching unlisted OT/diagonalization force companions at
# EPS_SCF=1E-9 agree within 3.7E-12 Ha in energy, numerical zero in force, and
# 0.27 bar in analytical stress when initialized from the same refined WFN.
# Keep these physics checks manual so the registered restart/AUTO coverage
# remains inexpensive.
