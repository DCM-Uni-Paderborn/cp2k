# Slow/manual ADDED_MOS AUTO tail companions: run
# Al_kp_ot_added_auto_converge.inp and Al_kp_ot_added_auto_sym3_converge.inp
# by hand. They are intentionally not listed here, so the default regtest stays
# cheap while the adaptive AUTO grow path can still be checked against the
# 1E-6 Mermin path.  The current isolated HIGH references grow AUTO 4->8->16:
# the one-k-point path converges in 151 total OT calls at -8.14585334840572 Ha,
# the reduced 3-point path in 40 final-stage calls at -8.15998708351193 Ha,
# and the full-grid path in 28 at -8.15998672984139 Ha.  The reduced/full
# endpoint difference is 3.6E-7 Ha.  No first/last-band, AUTO-exhausted,
# MAX-ITER, or "Unsupported content type" signature is printed.
# Al_kp_ot_uks_full_all_sym3_converge.inp is the unlisted four-channel UKS
# physics companion.  With two spins, two irreducible k-points, and fixed
# magnetization it converges in 153 uninterrupted MPI-2 OT steps to
# -8.14036040968823 Ha, within 5.3E-7 Ha of diagonalization while retaining
# weighted spin populations 7/5 and finite entropy.
# Al_kp_ot_uks_common_mu_sym3_converge.inp is the complementary shared-mu
# four-channel anchor.  FULL_ALL converges in 184 MPI-2 steps to
# -8.16155071307069 Ha, within 2.0E-7 Ha of diagonalization, and reproduces
# the unconstrained spin populations 6.33333/5.66667.  FULL_SINGLE_INVERSE
# independently reaches the same branch within 4.4E-7 Ha in 115 steps.
