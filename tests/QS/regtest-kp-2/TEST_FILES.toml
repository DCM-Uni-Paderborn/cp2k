# Slow/manual ADDED_MOS AUTO tail companions: run
# Al_kp_ot_added_auto_converge.inp and Al_kp_ot_added_auto_sym3_converge.inp
# by hand. They are intentionally not listed here, so the default regtest stays
# cheap while the adaptive AUTO grow path can still be checked against the
# 1E-6 Mermin path.  The 2x1x1 reference grows AUTO 4->8->16 in 37/37/21
# MPI-2 stage steps and reaches -8.14585310802196 Ha. The symmetry-reduced
# 3x1x1 reference uses 22/22/214 steps and reaches -8.15998707519034 Ha
# without overgrowing its empty virtual edge. The explicit full-grid 3x1x1
# companion retains the initial buffer of 4 and converges in 96 steps at
# -8.15998707639814 Ha. Their endpoints agree within 1.3E-9 Ha even though
# their local virtual-space growth histories differ.
# No first/last-band, AUTO-exhausted, MAX-ITER, or "Unsupported content type"
# signature is printed.
# Al_kp_ot_added_auto_sym3_force.inp is an unlisted EPS_SCF=1E-8 force
# companion that reads the reduced-grid converged restart. Its force components
# agree with matching diagonalization within 7.1E-7 Ha/bohr.
# Al_kp_ot_uks_full_all_sym3_converge.inp is the unlisted four-channel UKS
# physics companion.  With two spins, two irreducible k-points, and fixed
# magnetization it converges in 85 uninterrupted MPI-2 OT steps to
# -8.14036048931759 Ha, within 4.5E-7 Ha of diagonalization while retaining
# weighted spin populations 7/5 and finite entropy.
# Al_kp_ot_uks_common_mu_sym3_converge.inp is the complementary shared-mu
# four-channel anchor.  FULL_ALL converges in 115 MPI-2 steps to
# -8.16155091568467 Ha, within 6.3E-9 Ha of diagonalization, and
# reproduces the unconstrained spin populations 6.33333/5.66667.
# The unlisted Al_kp_ot_gaussian_sym3_converge.inp and its restart companion
# provide the converged symmetry-reduced Gaussian path; the restart closes in
# one step.  Al_kp_ot_gaussian_gamma_converge.inp is the complete-space Gamma
# companion and converges in 121 final-space MPI-2 steps without flat-tail
# recovery. Their matching unlisted Al_kp_diag_gaussian_* inputs are
# independent diagonalization references.
# Keep these physics checks manual so the registered restart/AUTO coverage
# remains inexpensive.
"Al_kp_ot_restart_write.inp"            = [{matcher="E_total", tol=1.0E-10, ref=-8.11587961821005},
                                           {matcher="Mermin_free_energy", tol=1.0E-10, ref=-8.11587961821005},
                                           {matcher="Electronic_entropic_energy", tol=1.0E-8, ref=-3.004898018E-5},
                                           {matcher="N_kpoints", tol=0.0, ref=1},
                                           {matcher="NO_TEXT", text="K-point smearing includes the first band"},
                                           {matcher="NO_TEXT", text="K-point smearing includes the last band"},
                                           {matcher="NO_TEXT", text="MAX ITER EXCEEDED"},
                                           {matcher="NO_TEXT", text="Unsupported content type"}]
# Write/read remain short restart-I/O smokes.  The bounded continue job is the
# converged 1E-6 physics anchor: it preserves the adaptive history,
# allows one bounded reader step, and retains finite entropy.  Keep the early
# one-k-point smoke references strict.  Their current values include the
# line-search-consistent adaptive canonical tether, which is fixed for all
# trial points belonging to one accepted gradient. Continue converges in
# 78 MPI-2 or 88 serial steps; both layouts remain within 1.2E-8 Ha of the
# tightly converged diagonalization reference -8.14585309375351 Ha and agree
# with each other within 3.8E-9 Ha.
