# converged 1E-6 physics anchor: it preserves the adaptive history,
# allows one bounded reader step, and retains finite entropy.  Keep the early
# one-k-point smoke references strict.  Their current values include the
# line-search-consistent adaptive canonical tether, which is fixed for all
# trial points belonging to one accepted gradient. Continue converges in
