# Slow/manual ADDED_MOS AUTO tail companions: run
# Al_kp_ot_added_auto_converge.inp and Al_kp_ot_added_auto_sym3_converge.inp
# by hand. They are intentionally not listed here, so the default regtest stays
# cheap while the adaptive AUTO grow path can still be checked against the
# 1E-6 Mermin path. Expected final checks for the cheaper companion:
# E_total = Mermin = -8.14585274158708 Ha, ADDED_MOS_AUTO = 4,
# ADDED_MOS_AUTO_GROW_SEQUENCE = "8,16", and no first/last-band or
# AUTO-exhausted warning is printed.
# Current HIGH companion references after the k-point AUTO post-resize
# convergence gate: the Sym3 path grows to 8 and 16 and has E_total = Mermin =
# -8.1599869891 Ha.  The full-grid companion follows the same AUTO growth
# sequence and has E_total = Mermin = -8.1599870796 Ha.  In both tails the
# gauge-free eigenvalue-density response remains active instead of being
# Fermi-window damped a second time, and no first/last-band or AUTO-exhausted
# warning is printed.  Exact SCF step counts are intentionally not part of
# these optional companion references.
# Use ADDED_MOS_AUTO_GROW_SEQUENCE = "8,16" and the NO_TEXT first/last-band
# smearing guards for the long optional physics checks.
