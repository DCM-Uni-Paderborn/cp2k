# runs are executed in the same order as in this file
# the second field tells which test should be run in order to compare with the last available output
# e.g. 0 means do not compare anything, running is enough
#      1 compares the last total energy in the file
#      for details see cp2k/tools/do_regtest
#
# Sirius will run in serial and parallel with or without cuda
# M085 checks the internal FORCE_EVAL energy reported by SIRIUS. The presence
# matcher ensures that every smearing run also reports the Mermin free energy;
# add a numeric SIRIUS_Mermin_free_energy reference when refreshing outputs.
#
# testing global tree creation using single exact potential, the deterministic random number generator
#   with the standard move types, check i
# fully test non colinear magnetism with spin orbit coupling
"Au.inp"                                = [{matcher="M085", tol=5.0E-8, ref=-147.22561661461222},
                                             {matcher="SIRIUS_Mermin_free_energy_present"}]
